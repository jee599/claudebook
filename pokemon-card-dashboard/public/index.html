<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎴 포켓몬 일본판 카드 시세 대시보드</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="vendor/chart.umd.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🎴</span>
      <div>
        <h1>포켓몬 일본판 카드 시세 대시보드</h1>
        <p class="sub">日本版 ポケモンカード · 현재 시세 · 1년 추이 · 적정 매수가 · 상승 확률</p>
      </div>
    </div>
    <div class="rate-badge" id="rateBadge">환율 로딩중…</div>
  </header>

  <!-- 요약 통계 -->
  <section class="summary" id="summary"></section>

  <!-- 컨트롤 -->
  <section class="controls">
    <input type="search" id="search" placeholder="🔎 카드명 / 확장팩 검색 (예: 리자몽, クレイバースト)" />
    <select id="rarityFilter"><option value="">전체 등급</option></select>
    <select id="recoFilter">
      <option value="">전체 추천</option>
      <option value="buy">매수 추천</option>
      <option value="hold">관망</option>
      <option value="sell">매도/관망 고려</option>
    </select>
    <select id="sortBy">
      <option value="probUp">상승 확률순</option>
      <option value="yearChangePct">1년 상승률순</option>
      <option value="current">현재가 높은순</option>
      <option value="cheap">싸게 살 기회순</option>
    </select>
    <label class="chk"><input type="checkbox" id="cheapOnly" /> 지금 저렴한 카드만</label>
  </section>

  <!-- 카드 그리드 -->
  <main id="grid" class="grid"></main>
  <p class="empty" id="emptyMsg" hidden>조건에 맞는 카드가 없습니다.</p>

  <footer class="foot">
    샘플 데이터 기반 데모 · 시세는 메타데이터로 생성된 모의 값입니다. 실제 매매 판단의 근거로 사용하지 마세요.
  </footer>

  <!-- 상세 모달 -->
  <div class="modal" id="modal" hidden>
    <div class="modal-box">
      <button class="close" id="closeModal">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
